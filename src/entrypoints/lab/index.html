<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture lab · What's the Catch</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; margin: 24px; max-width: 1100px; }
      table { border-collapse: collapse; width: 100%; margin-top: 16px; }
      th, td { border-bottom: 1px solid #e5e7eb; padding: 6px 8px; text-align: left; vertical-align: top; }
      .pass { color: #047857; font-weight: 600; } .fail { color: #b91c1c; font-weight: 600; }
      .muted { color: #6b7280; font-size: 12px; } pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
      button { font: inherit; padding: 6px 12px; margin-right: 8px; }
    </style>
  </head>
  <body>
    <h1>Fixture lab</h1>
    <p>Runs the rules and Gemini Nano on every page in <code>public/fixtures/</code> and scores them against
      <code>index.json</code>. Week 1 gate: the AI gets <b>7 of 10</b> pages right.</p>
    <p>On-device AI: <b id="ai">checking…</b> <span id="progress" class="muted"></span></p>
    <button id="download" hidden>Download model</button>
    <button id="run">Run all fixtures</button>
    <span id="score"></span>
    <table>
      <thead><tr><th>Page</th><th>Expected</th><th>Rules</th><th>AI</th><th>AI findings (quote-checked)</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
